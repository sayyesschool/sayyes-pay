name: Напоминания о пробном уроке

# Vercel на тарифе Hobby разрешает cron только раз в сутки, поэтому расписание живёт здесь.
#
# Главное, что нужно знать: **GitHub не выполняет schedule вовремя**. Записано
# каждые 15 минут, а фактически 2 сентября запуски были в 07:06, 11:39 и 15:52 —
# раз в четыре с половиной часа. Из-за этого запросы подтверждения не уходили вообще.
#
# Поэтому один запуск теперь работает почти шесть часов и сам дёргает бота каждые 5 минут.
# Любой новый запуск по расписанию отменяет предыдущий (concurrency), так что циклы
# не накапливаются. Репозиторий публичный, минуты Actions для него бесплатны.
#
# Требуется секрет репозитория CRON_SECRET — то же значение, что в переменных Vercel.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Дёргать /api/cron/reminders каждые 5 минут
        run: |
          END=$(( $(date +%s) + 20400 ))
          FAILS=0
          while [ "$(date +%s)" -lt "$END" ]; do
            code=$(curl -sS -m 60 -o body.txt -w '%{http_code}' \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              https://www.sayyestoenglish.com/api/cron/reminders) || code=000
            echo "$(date -u +%H:%M:%S) HTTP $code $(head -c 400 body.txt)"
            if [ "$code" != "200" ]; then FAILS=$((FAILS+1)); else FAILS=0; fi
            if [ "$FAILS" -ge 6 ]; then echo "Шесть отказов подряд — падаем, чтобы было видно"; exit 1; fi
            sleep 300
          done
