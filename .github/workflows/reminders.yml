name: Напоминания о пробном уроке

# Vercel на тарифе Hobby разрешает cron только раз в сутки — поэтому в vercel.json
# стоит "0 8 * * *", и напоминание за час физически не может сработать.
# Этот workflow дёргает тот же эндпоинт каждые 15 минут, чего хватает и для
# напоминания за сутки, и для напоминания за час.
#
# Требуется секрет репозитория CRON_SECRET — то же значение, что в переменных
# окружения Vercel. Settings → Secrets and variables → Actions → New secret.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Вызвать /api/cron/reminders
        run: |
          code=$(curl -sS -o body.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.sayyestoenglish.com/api/cron/reminders)
          echo "HTTP $code"
          cat body.txt
          echo
          test "$code" = "200"
